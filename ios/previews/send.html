<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ADDITION — Send</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="phone">
    <div class="notch">Send</div>
    <div class="screen">
      <img class="wordmark" src="../AdditionWallet/AdditionWallet/Assets.xcassets/Logo.imageset/Logo.png" alt="ADDITION">
      <p class="title">Send ADD</p>
      <div class="card">
        <div class="asset">
          <img class="mark" src="../AdditionWallet/AdditionWallet/Assets.xcassets/Mark.imageset/Mark.png" alt="ADD">
          <div><b>ADD</b><span>ADDITION</span></div>
          <div class="amt">—</div>
        </div>
      </div>
      <div class="card">
        <h3>Amount</h3>
        <input class="field" placeholder="Whole units" readonly>
        <h3 style="margin-top:14px">Fee (blank uses node fee_info)</h3>
        <input class="field small" placeholder="1" readonly>
      </div>
      <div class="card">
        <h3>To</h3>
        <input class="field small" placeholder="128-hex ADDITION address" readonly>
      </div>
      <button class="btn">Send</button>
      <p class="status">Set a write RPC node you control, then create or load a wallet.</p>
    </div>
    <nav class="tabs">
      <a href="home.html">Home</a>
      <a href="receive.html">Receive</a>
      <a class="on" href="send.html">Send</a>
      <a href="activity.html">Activity</a>
    </nav>
  </div>
</body>
</html>
