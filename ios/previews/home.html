<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ADDITION — Home</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="phone">
    <div class="notch">Home</div>
    <div class="screen">
      <div class="row">
        <img class="wordmark" src="../AdditionWallet/AdditionWallet/Assets.xcassets/Logo.imageset/Logo.png" alt="ADDITION">
        <div class="gear">⚙</div>
      </div>
      <p class="kicker">Research testnet</p>
      <p class="hero">unavailable</p>
      <p class="mono">No wallet loaded</p>
      <div class="actions">
        <div class="act"><i>↓</i>Receive</div>
        <div class="act"><i>↑</i>Send</div>
        <div class="act"><i>↻</i>Refresh</div>
      </div>
      <div class="card">
        <h3>Asset</h3>
        <div class="asset">
          <img class="mark" src="../AdditionWallet/AdditionWallet/Assets.xcassets/Mark.imageset/Mark.png" alt="ADD">
          <div><b>ADD</b><span>ADDITION</span></div>
          <div class="amt">—</div>
        </div>
      </div>
      <div class="card">
        <h3>Activity</h3>
        <p class="status" style="margin:0">No activity from write RPC yet.</p>
        <div class="pair">
          <button class="btn">Create</button>
          <button class="btn ghost">Load</button>
        </div>
        <p class="status">Set a write RPC node you control, then create or load a wallet.</p>
      </div>
    </div>
    <nav class="tabs">
      <a class="on" href="home.html">Home</a>
      <a href="receive.html">Receive</a>
      <a href="send.html">Send</a>
      <a href="activity.html">Activity</a>
    </nav>
  </div>
</body>
</html>
