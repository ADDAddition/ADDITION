# ADDITION research testnet configuration.
# This is not a live mainnet. Default network is testnet.

network = "testnet"
network_name = "addition-testnet"
network_id = "ADDITION_TESTNET_V1"
data_dir = "data"
genesis_file = "genesis.json"

# Operator's current public P2P (IPv4 only). Not a peer-count claim.
# Outsiders join this endpoint. Write RPC stays 127.0.0.1:8545.
# Local two-node runs still pass --bootstrap 127.0.0.1:28545.
# Seed operator: set ADDITION_ADVERTISED_P2P=34.27.30.115:28545 (or
# advertised_p2p below) so public getinfo/peers do not list self.
# Public TCP 28545 can timeout or be filtered; HTTP :80 sync is the
# reliable join path. Do not claim public 28545 always works.
bootstrap_peers = [
  "34.27.30.115:28545"
]

# Public read RPC is off unless --public-rpc or ADDITION_ENABLE_PUBLIC_RPC=1.
# It never exposes mine, sendtx, createwallet, or identity rotation.
enable_public_rpc = false

# In-process auto-mine is testnet only, off by default, never a public RPC command.
# Enable with --auto-mine or ADDITION_AUTO_MINE=1. After N seconds the daemon
# mines one block and persists it to --data-dir/blocks.dat (same path as today).
enable_auto_mine = false
auto_mine_interval_sec = 60
auto_mine_reward = "miner1"

[ports]
local_rpc = 8545
lan_rpc = 18545
p2p = 28545
public_rpc = 38545
public_rpc_bind = "0.0.0.0"
# Seed only. Leave empty on local two-node runs.
# advertised_p2p = "34.27.30.115:28545"

[chain]
block_reward = 50
max_supply = 50000000
target_block_time_sec = 60
halving_interval = 210000
tail_emission_reward = 1
min_fee = 0
genesis_timestamp = 1763000000
# Testnet PoW: SHA3-512 of the header vs difficulty_target. Not memory-hard.
# Higher target = easier. Easy bound (~2^16 hashes) is also the ceiling.
# The old max 0x00FFFFFFFFFFFFFF (2^56-1) mined in a few milliseconds.
# Burst mining hardens toward min; a stale genesis timestamp is skipped.
pow_algorithm = "sha3_512"
initial_difficulty_target = 0x0000FFFFFFFFFFFF
max_difficulty_target = 0x0000FFFFFFFFFFFF
min_difficulty_target = 0x000000FFFFFFFFFF
retarget_window = 30
