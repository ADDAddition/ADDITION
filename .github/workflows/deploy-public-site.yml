name: deploy-public-site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/public/**"
      - "scripts/deploy_public_site.sh"
      - ".github/workflows/deploy-public-site.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    defaults:
      run:
        working-directory: web/public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Workers + Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_RPC_HTTP: ${{ secrets.PUBLIC_RPC_HTTP }}
        run: |
          EXTRA=()
          if [ -n "${PUBLIC_RPC_HTTP:-}" ]; then
            EXTRA+=(--var "PUBLIC_RPC_HTTP:${PUBLIC_RPC_HTTP}")
          fi
          npx --yes wrangler@4 deploy "${EXTRA[@]}"
