name: addition-core

on:
  pull_request:
    paths:
      - "client/addition_app/**"
      - ".github/workflows/addition-core.yml"
  push:
    paths:
      - "client/addition_app/**"
      - ".github/workflows/addition-core.yml"

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/addition_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
