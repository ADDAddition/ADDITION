<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADDITION status</title>
  <link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:image" content="https://additionblockchain.com/og.png"><meta name="twitter:image" content="https://additionblockchain.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h2>getinfo</h2>
    <p id="rpc-state"></p>
    <div id="info-fields"></div>
    <pre id="info-raw" class="raw"></pre>
  </main>
  <footer id="site-footer"></footer>
  <script src="/common.js"></script>
  <script src="/chrome.js"></script>
  <script>
    const S = window.AdditionSite;
    async function load() {
      const info = await S.rpcCommand("getinfo");
      const state = document.getElementById("rpc-state");
      const raw = document.getElementById("info-raw");
      const fields = document.getElementById("info-fields");
      if (info.offline || !info.ok) {
        state.className = "offline";
        state.textContent = "RPC offline";
        raw.textContent = "RPC offline";
        S.renderFields(fields, {}, "RPC offline");
        return;
      }
      state.textContent = "";
      raw.textContent = info.raw;
      S.renderFields(fields, info.fields, "RPC offline");
    }
    load();
  </script>
</body>
</html>
