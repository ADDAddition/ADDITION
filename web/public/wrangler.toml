name = "addition-explorer"
account_id = "c4ceeebc81b5a07252d4d4244e50a916"
main = "worker.js"
compatibility_date = "2026-03-03"

# wrangler deploy replaces zone routes for this Worker. Keep every public host.
[[routes]]
pattern = "additionblockchain.com/*"
zone_name = "additionblockchain.com"
[[routes]]
pattern = "www.additionblockchain.com/*"
zone_name = "additionblockchain.com"
[[routes]]
pattern = "rpc.additionblockchain.com/*"
zone_name = "additionblockchain.com"

[assets]
directory = "."
binding = "ASSETS"
# Let the worker see /rpc?cmd= even after a trailing-slash redirect to /rpc/.
run_worker_first = ["/rpc*", "/api/rpc*", "/jsonrpc*", "/local-rpc*"]

[vars]
# Leave empty: down node → "RPC offline".
# Operator: set this to the real public-rpc HTTP URL (example http://127.0.0.1:38545/rpc).
# Do not commit trycloudflare or other ephemeral tunnel URLs.
PUBLIC_RPC_HTTP = ""
