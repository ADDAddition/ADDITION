name = "addition-explorer"
account_id = "c4ceeebc81b5a07252d4d4244e50a916"
main = "worker.js"
compatibility_date = "2026-03-03"

# wrangler deploy replaces zone routes for this Worker. Keep every public host.
[[routes]]
pattern = "additionblockchain.com/*"
zone_name = "additionblockchain.com"
[[routes]]
pattern = "www.additionblockchain.com/*"
zone_name = "additionblockchain.com"
[[routes]]
pattern = "<your-node>/*"
zone_name = "additionblockchain.com"

[assets]
directory = "."
binding = "ASSETS"
# Let the worker see /rpc?cmd= even after a trailing-slash redirect to /rpc/.
run_worker_first = ["/rpc*", "/api*", "/jsonrpc*", "/local-rpc*"]

# Optional upstream for /api/rpc: an operator may set PUBLIC_RPC_URL (or legacy
# PUBLIC_RPC_HTTP) as a Worker secret. CI never sets it and the site does not
# depend on it: unset -> "RPC offline" and the pages use the visitor's own node.
