<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADDITION explorer</title>
  <link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:image" content="https://additionblockchain.com/og.png"><meta name="twitter:image" content="https://additionblockchain.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <header id="site-header"></header>
  <div id="live-strip" class="status-strip pending" aria-live="polite">
    <div class="status-strip-inner">
      <span id="strip-flag" class="status-flag">…</span>
      <dl id="strip-cells" class="status-cells"></dl>
    </div>
  </div>
  <main>
    <form id="search-form" class="search-form" action="/" method="get">
      <input id="q" name="q" type="search" autocomplete="off"
        placeholder="block height, block hash, tx hash, address">
      <button type="submit">Search</button>
    </form>
    <p id="search-status" hidden></p>
    <p class="note">Public read: <a href="/rpc/">RPC commands</a> · <a href="/status/">getinfo</a> · <a href="/block/">block</a> · <a href="/tx/">tx</a> · <a href="/address/">address</a></p>
    <section>
      <h2>Latest Blocks</h2>
      <p id="rpc-state"></p>
      <table class="blocks-table">
        <thead>
          <tr>
            <th>height</th>
            <th>hash</th>
            <th>tx_count</th>
            <th>time</th>
          </tr>
        </thead>
        <tbody id="latest-blocks"></tbody>
      </table>
    </section>
    <section>
      <h2>Latest Transactions</h2>
      <p id="tx-state" class="note">From recent <code>getblock</code> <code>tx_hashes</code> when present.</p>
      <table class="blocks-table">
        <thead>
          <tr>
            <th>tx_hash</th>
            <th>height</th>
            <th>index</th>
          </tr>
        </thead>
        <tbody id="latest-txs"></tbody>
      </table>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/common.js"></script>
  <script src="/chrome.js"></script>
  <script src="/explorer.js"></script>
</body>
</html>
